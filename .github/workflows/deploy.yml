name: Deploy to Production (Hostinger VPS)

on:
  push:
    branches:
      - main

# Évite les déploiements concurrents simultanés si plusieurs merges s'enchaînent
concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Auto Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Exécution du déploiement sur le VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            # Nettoyer d'éventuels guillemets ou espaces dans le secret
            RAW_DIR="${{ secrets.VPS_APP_DIR || '/var/www/meloStart' }}"
            TARGET_DIR=$(echo "$RAW_DIR" | tr -d "'\"" | xargs)
            REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

            echo "👤 Utilisateur connecté sur le VPS : $(whoami)"
            echo "📍 Dossier de connexion : $(pwd)"
            echo "🎯 Dossier cible demandé : $TARGET_DIR"

            # Tenter de créer le dossier s'il n'existe pas encore
            if [ ! -d "$TARGET_DIR" ]; then
              echo "🛠️ Création du dossier $TARGET_DIR..."
              mkdir -p "$TARGET_DIR" 2>/dev/null || sudo mkdir -p "$TARGET_DIR" 2>/dev/null || true
            fi

            # Si impossible d'accéder au dossier (droits restreints sur /var/www par exemple), basculer vers $HOME
            if ! cd "$TARGET_DIR" 2>/dev/null; then
              echo "⚠️ Accès refusé à $TARGET_DIR (problème de permissions)."
              TARGET_DIR="$HOME/meloStart"
              echo "➡️ Bascule automatique vers le répertoire personnel : $TARGET_DIR"
              mkdir -p "$TARGET_DIR"
              cd "$TARGET_DIR"
            fi

            echo "📂 Dans le dossier de déploiement : $(pwd)"

            # Si le projet n'est pas encore cloné la première fois
            if [ ! -d ".git" ]; then
              echo "📦 Premier déploiement : Clonage du projet depuis GitHub..."
              git clone "$REPO_URL" .
            fi

            # Charger l'environnement Node/NVM si nécessaire
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH="$PATH:/usr/local/bin:/usr/bin:$HOME/.npm-global/bin"

            echo "📥 1/5 - Récupération du code le plus récent (branche main)..."
            git remote set-url origin "$REPO_URL" || true
            git fetch origin main
            git reset --hard origin/main

            echo "📦 2/5 - Installation des dépendances..."
            npm ci --prefer-offline --no-audit

            echo "🗄️ 3/5 - Génération Prisma & synchronisation de la base..."
            npx prisma generate
            npx prisma db push

            echo "🏗️ 4/5 - Build de l'application Next.js..."
            npm run build

            echo "🔄 5/5 - Rechargement de l'application et du worker avec PM2..."
            if command -v pm2 &> /dev/null; then
              pm2 reload ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs
              pm2 save
            else
              npx pm2 reload ecosystem.config.cjs --update-env || npx pm2 start ecosystem.config.cjs
              npx pm2 save
            fi

            echo "✅ Déploiement terminé avec succès !"

